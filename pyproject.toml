[project]
name = "videodubbing"
version = "0.1.0"
description = "Logituit 2026 OTT Engagement — VideoDubbing POC"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.4",
    "streamlit>=1.35",
    "plotly>=5.20",
    "python-pptx>=1.0",
    "optuna>=3.6",
    "ruff>=0.15.16",
    "openai-whisper>=20250625",
    "deep-translator>=1.11.4",
    "edge-tts>=7.2.8",
    "jiwer>=4.0.0",
    "sacrebleu>=2.6.0",
    "pydub>=0.25.1",
    "gtts>=2.5.4",
    "anthropic>=0.107.1",
    "pyannote-audio>=3.3",
    "librosa>=0.11.0",
    "transformers>=5.10.2",
    "opencv-python>=4.13.0.92",
    "scipy>=1.17.1",
    "mediapipe>=0.10.35",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]
